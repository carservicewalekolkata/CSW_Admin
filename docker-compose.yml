version: "3.9"

x-csw-env: &csw-env
  MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in your environment}
  DB_CSW_NAME: ${DB_CSW_NAME:-}
  GOMECHANIC_BEARER_TOKEN: ${GOMECHANIC_BEARER_TOKEN:-}
  SUPER_USER_MAIL: ${SUPER_USER_MAIL:?Set SUPER_USER_MAIL in your environment}
  SUPER_USER_PASSWORD: ${SUPER_USER_PASSWORD:?Set SUPER_USER_PASSWORD in your environment}
  PORT: ${PORT:-3000}

x-runner-build: &runner-build
  context: .
  target: runner
  cache_from:
    - type=local,src=.docker/cache
  cache_to:
    - type=local,dest=.docker/cache,mode=max

services:
  admin-app:
    image: ghcr.io/carservicewalekolkata/csw-admin:latest
    build: *runner-build
    environment: *csw-env
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped

  scripts:
    image: ghcr.io/carservicewalekolkata/csw-admin:latest
    build: *runner-build
    entrypoint: ["sleep", "infinity"]
    environment: *csw-env
    profiles: ["scripts"]
