name: Deploy Development (Auto Live Dev URL)

on:
  push:
    branches: [development]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: carservicewalekolkata/csw-admin
  IMAGE_TAG: development
  RESOURCE_GROUP: cswapp-rg
  CONTAINERAPP_ENV: csw-admin-env
  CONTAINERAPP_NAME: csw-admin-dev

jobs:
  build-and-deploy:
    name: Build & Deploy Development Container
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # 1️⃣ Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Restore Docker build cache
      - name: Restore Docker layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # 3️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4️⃣ Log in to GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5️⃣ Build and push Docker image with caching
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runner
          build-args: |
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            DB_CSW_NAME=${{ secrets.DB_CSW_NAME }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false   # speeds up build (disables SBOM metadata)

      # 6️⃣ Login to Azure
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # client-secret not required if OIDC federated login is configured
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      # 7️⃣ Deploy to Azure Container App (Development)
      - name: Deploy to Azure (Development)
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.CONTAINERAPP_ENV }}
          containerAppName: ${{ env.CONTAINERAPP_NAME }}
          targetPort: 3000
          ingress: external
          environmentVariables: >
            NODE_ENV=production
            PUBLIC_SITE_BASE_URL=${{ secrets.PUBLIC_SITE_BASE_URL }}
            PUBLIC_CORS_ORIGINS=${{ secrets.PUBLIC_CORS_ORIGINS }}
            SITEMAP_BASE_URL=${{ secrets.SITEMAP_BASE_URL }}
            SITEMAP_SYNC_TOKEN=${{ secrets.SITEMAP_SYNC_TOKEN }}
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            DB_CSW_NAME=${{ secrets.DB_CSW_NAME }}
            GOMECHANIC_BEARER_TOKEN=${{ secrets.GOMECHANIC_BEARER_TOKEN }}
            SUPER_USER_MAIL=${{ secrets.SUPER_USER_MAIL }}
            SUPER_USER_PASSWORD=${{ secrets.SUPER_USER_PASSWORD }}
            COOKIE_NAME=${{ secrets.COOKIE_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_RESET_SECRET=${{ secrets.JWT_RESET_SECRET }}
            AZURE_STORAGE_ACCOUNT=${{ secrets.AZURE_STORAGE_ACCOUNT }}
            AZURE_STORAGE_ACCOUNT_KEY=${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
            AZURE_STORAGE_CONTAINER=${{ secrets.AZURE_STORAGE_CONTAINER }}

      # 8️⃣ Save cache for next builds
      - name: Save Docker build cache
        if: always()
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
